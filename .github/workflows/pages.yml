name: Website

# Builds the site (Astro, then a translated copy per language from content/i18n/) and deploys it to GitHub Pages.
# One-time setup: repo Settings > Pages > Build and deployment > Source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Build the site in every language
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          npm ci
          # The template repo itself (or a new repo that hasn't run `npm run init` yet) still says REPO-NAME, so its
          # CSS, links and GitHub links would point at /REPO-NAME/ and the live site would load unstyled. Fill in the
          # real name here, in the build copy only; nothing is committed. init also re-keys the translations.
          if grep -q '"/REPO-NAME"' site.config.json; then
            echo "::notice::site.config.json still has the REPO-NAME placeholder; building as $REPO_NAME."
            npm run init -- "$REPO_NAME"
          fi
          npm run build

      - name: Site size
        # GitHub Pages warns past 1 GB and may refuse the deploy. tools/prune-originals.ts keeps unused picture
        # originals out; this line shows the size on every run, and warns early if a repo is getting close.
        run: |
          mb=$(du -sm _site | cut -f1)
          echo "Deploying ${mb} MB (GitHub Pages limit: 1024 MB)." | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$mb" -gt 800 ]; then echo "::warning::The site is ${mb} MB, close to GitHub Pages' 1 GB limit. See 'Building and deploying' in CLAUDE.md."; fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
